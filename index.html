<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5DA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EscuelasCool">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>EscuelasCool – Registro en sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7FA; --surface:#FFFFFF; --ink:#1B2A3A; --muted:#566778; --line:#D3DCE5;
  --focus:#2F5DA8; --on-focus:#FFFFFF; --danger:#B3261E; --ok:#2E7D4F; --warn:#9A5B00;
  --note-bg:#E8F1FA; --err-bg:#FCE9E7;
  --kid:'Baloo 2','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111921; --surface:#1A2531; --ink:#E7EDF3; --muted:#9DB0C2; --line:#2D3B4A;
    --focus:#6FA3E8; --on-focus:#0D1620; --danger:#F2867C; --ok:#7FCB9C; --warn:#F0B35A;
    --note-bg:#1C2E44; --err-bg:#3A1F1C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111921; --surface:#1A2531; --ink:#E7EDF3; --muted:#9DB0C2; --line:#2D3B4A;
  --focus:#6FA3E8; --on-focus:#0D1620; --danger:#F2867C; --ok:#7FCB9C; --warn:#F0B35A;
  --note-bg:#1C2E44; --err-bg:#3A1F1C; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #F0A33A;outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;max-width:1040px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em}
.mini{display:flex;gap:3px}
.mini i{display:block;width:7px;height:22px;clip-path:polygon(0 18%,50% 0,100% 18%,100% 100%,0 100%)}
.link{background:none;border:0;color:var(--focus);font-weight:700;padding:10px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.progress{display:flex;gap:6px;flex:1;max-width:620px}
.seg{flex:1;height:16px;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);opacity:.2;transition:opacity .3s}
.seg.cur{opacity:.55}.seg.done{opacity:1}
.team{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}

.wrap{max-width:1040px;margin:0 auto;padding:8px 20px 40px}
.narrow{max-width:620px}
.center{text-align:center}
.h-eval{font-family:var(--body);font-size:30px;line-height:1.15;margin:12px 0 6px}
.lead{font-size:19px;color:var(--muted);margin:6px 0 20px}
.meta{color:var(--muted);font-size:15px;margin:4px 0}
.note{background:var(--note-bg);border-radius:12px;padding:10px 14px;font-size:15px;margin:12px 0}
.err{color:var(--danger);font-weight:700;min-height:1.5em;text-align:center;margin:10px 0 0}
.empty{color:var(--muted)}

.q-title{font-family:var(--kid);font-weight:800;font-size:clamp(28px,5.4vw,46px);line-height:1.1;text-align:center;margin:18px 0 26px;text-wrap:balance}
.sub{font-family:var(--kid);font-size:22px;margin:16px 0 8px;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;border-radius:16px;border:0;background:var(--focus);color:var(--on-focus);font-weight:700;font-size:19px;cursor:pointer}
.btn.big{min-height:68px;font-size:22px;padding:0 34px;font-family:var(--kid)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.file{position:relative;overflow:hidden}
.foot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:52px;min-width:52px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:18px}
.chip.on{background:var(--focus);color:var(--on-focus);border-color:var(--focus)}
.grid{display:grid;gap:8px}
.months{grid-template-columns:repeat(6,1fr)}
.days{grid-template-columns:repeat(7,1fr)}
.grid .chip{padding:0;font-family:var(--kid);font-size:20px}
@media (max-width:560px){.months{grid-template-columns:repeat(4,1fr)}}

.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:10px}
.name{min-height:66px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-family:var(--kid);font-weight:600;font-size:21px;cursor:pointer;padding:6px 10px;line-height:1.1}

.faces{display:flex;gap:clamp(6px,1.8vw,18px);justify-content:center;align-items:stretch}
.face{flex:1 1 0;min-width:0;max-width:190px;background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:12px 6px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .12s}
.face svg{width:100%;max-width:128px;height:auto;display:block}
.face .lbl{font-family:var(--kid);font-weight:600;font-size:clamp(13px,2.7vw,19px);line-height:1.1;text-align:center}
.face[aria-checked="true"]{border-color:var(--focus);box-shadow:0 0 0 4px var(--focus);transform:translateY(-3px)}
@media (max-width:600px){
  .faces{flex-direction:column;align-items:stretch;max-width:420px;margin:0 auto;gap:10px}
  .face{flex-direction:row;max-width:none;padding:8px 14px;gap:16px;border-radius:20px}
  .face svg{width:64px;flex:0 0 64px}
  .face .lbl{font-size:21px;text-align:left}
  .face[aria-checked="true"]{transform:none}
  .q-title{margin:10px 0 18px}
}
.grid .chip{min-width:0}

.steps-kid{text-align:left;font-size:21px;line-height:1.35;max-width:520px;margin:0 auto 10px;padding-left:1.4em}
.steps-kid li{margin:8px 0}
.demo-stim{width:220px;height:110px;margin:4px auto 18px;border-radius:18px;background:#000;display:flex;align-items:center;justify-content:center;color:#FF3B30;font-weight:700;font-size:56px;font-variant-numeric:tabular-nums}
.done-mark{width:140px;margin:10px auto 0}

.stage{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ctr{font-family:var(--body);font-weight:700;font-size:clamp(72px,20vw,180px);font-variant-numeric:tabular-nums;color:#FF3B30;line-height:1}
.ctr.off{visibility:hidden}
.ctr.warn{color:#FFB020}
.smsg{position:absolute;left:0;right:0;bottom:22%;text-align:center;color:#fff;font-family:var(--kid);font-size:clamp(26px,5vw,42px);font-weight:800;pointer-events:none}
.smsg.big{bottom:auto;font-size:clamp(80px,22vw,200px)}
.hold-stop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:46px;height:46px;border-radius:50%;border:1px solid #2a2a2a;background:transparent;color:#3a3a3a;font-size:13px}
.hold-stop.holding{border-color:#888;color:#aaa}

.panel .block{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:16px 0}
.panel h2{font-size:20px;margin:0 0 8px}
.block.danger{border-color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0}
.stats div{border-left:4px solid var(--line);padding:2px 10px}
.stats dt{font-size:14px;color:var(--muted)}
.stats dd{margin:0;font-size:28px;font-weight:700}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.wrap-txt{white-space:normal;min-width:220px;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:13px;font-weight:700;border:1px solid currentColor}
.tag.ok{color:var(--ok)}.tag.pend{color:var(--warn)}.tag.bad{color:var(--danger)}
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-weight:700;font-size:16px}
.form input,.form select{min-height:50px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:400}
.form .chk{display:flex;align-items:center;gap:10px;font-weight:400}
.form .chk input{min-height:auto;width:22px;height:22px}
.form fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form legend{font-weight:700;padding:0 6px}
.alt{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}

.modal-bg{position:fixed;inset:0;background:rgba(10,18,26,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:22px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:22px}
.modal .foot{margin-top:18px}
.dots{display:flex;gap:12px;justify-content:center;margin:12px 0 16px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:62px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-size:24px;font-weight:700;cursor:pointer}
.choices{display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;z-index:200;max-width:90vw;font-size:16px}
.fatal{max-width:560px;margin:60px auto;padding:20px;background:var(--err-bg);border-radius:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ==========================================================================
   EscuelasCool – Registro en sala (WP2.2)
   Flujo: identificación (lista + cumpleaños) → ánimo → somnolencia →
   sensación térmica → preferencia térmica (opcional) → PVT-B 3 min.
   Guardado local primero (IndexedDB, después de cada pantalla),
   envío a REDCap (API, solo importación) con confirmación por sesión.
   ========================================================================== */
const APP_VERSION = '0.1.0';
const C = ['#2F5DA8','#5AA6D6','#7DBE8C','#F0A33A','#D9483B'];
const INK = '#1B2A3A';
const PAISES = {'1':'Chile','2':'Perú','3':'Colombia'};
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const PVT_DEFAULT = {dur_s:180, isi_min:1000, isi_max:4000, lapso:355, fs:100, timeout:30000, fb:1000, practica_s:15};
const DEFAULT_CFG = {pais:'', colegio:'', evaluador:'', dispositivo:'', pin:'', redcap_url:'', redcap_token:'',
  pvt:{...PVT_DEFAULT}, practica_on:true, pref_on:true, demo:false};

const QS = [
  {key:'animo', titulo:'¿Cómo te sientes hoy?', kind:'mood',
   ops:[[1,'Muy mal'],[2,'Un poco mal'],[3,'Bien'],[4,'Muy bien']]},
  {key:'somnolencia', titulo:'¿Cuánto sueño tienes ahora?', kind:'sleep',
   ops:[[1,'Nada de sueño'],[2,'Un poco'],[3,'Bastante'],[4,'Mucho sueño']]},
  {key:'sens_termica', titulo:'¿Cómo sientes la temperatura de la sala ahora?', kind:'thermal',
   ops:[[1,'Mucho frío'],[2,'Un poco de frío'],[3,'Ni frío ni calor'],[4,'Un poco de calor'],[5,'Mucho calor']]},
  {key:'pref_termica', titulo:'¿Cómo te gustaría que estuviera la sala?', kind:'pref', opt:'pref_on',
   ops:[[1,'Más fresca'],[2,'Así está bien'],[3,'Más tibia']]}
];

const REDCAP_FIELDS = ['record_id','id_estudiante','metodo_id','pais','colegio','sala','evaluador','dispositivo',
  'dispositivo_info','app_version','zona_horaria','tz_offset_min','inicio','fin','animo','somnolencia','sens_termica',
  'pref_termica','estado_sesion','motivo_incompleta','pvt_completa','pvt_interrumpida','pvt_inicio','pvt_duracion_s',
  'pvt_isi_min_ms','pvt_isi_max_ms','pvt_umbral_lapso_ms','pvt_umbral_fs_ms','pvt_n_estimulos','pvt_n_validas',
  'pvt_rt_media','pvt_rt_mediana','pvt_vel_media','pvt_rt_rapido10','pvt_vel_lento10','pvt_lapsos',
  'pvt_falsas_partidas','pvt_puntaje','pvt_ensayos','practica_realizada','sesion_complete'];

const DEMO_ROSTER = [['DEMO-01','Ana P.','2015-04-12'],['DEMO-02','Benja R.','2015-09-03'],['DEMO-03','Camila S.','2016-01-21'],
  ['DEMO-04','Dani M.','2015-11-30'],['DEMO-05','Emi T.','2015-06-08'],['DEMO-06','Fran G.','2016-02-14'],
  ['DEMO-07','Gabi L.','2015-07-27'],['DEMO-08','Isa V.','2015-03-05'],['DEMO-09','Joaquín C.','2015-12-19'],
  ['DEMO-10','Mati F.','2016-03-02']].map(([id,n,d])=>({record_id:id,nombre:n,fecha_nacimiento:d,sala:'5° A (demo)'}));

const S = {cfg:null, roster:[], sala:null, ses:null, fails:0};
const app = document.getElementById('app');

/* ---------- utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n,w=2) => String(n).padStart(w,'0');
const first = n => String(n||'').trim().split(/\s+/)[0];
function stamp(d, ms=false){
  const s = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  return ms ? s + '.' + pad(d.getMilliseconds(),3) : s;
}
function compact(d){ return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }
function hex(nBytes){ const a = new Uint8Array(nBytes); crypto.getRandomValues(a); return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function newId(d){ return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${hex(8)}`; }
function tzName(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){ return ''; } }
function devInfo(){ return `${navigator.userAgent} | pantalla ${screen.width}x${screen.height} @${window.devicePixelRatio||1}`; }
const r1 = x => x==null || !isFinite(x) ? null : Math.round(x*10)/10;
const r3 = x => x==null || !isFinite(x) ? null : Math.round(x*1000)/1000;
const inClaude = () => !!(window.claude && typeof window.claude.use === 'function');
const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }

/* ---------- almacenamiento local (IndexedDB) ---------- */
const DB = {
  db:null,
  open(){ return new Promise((res,rej)=>{
    const r = indexedDB.open('escuelascool', 1);
    r.onupgradeneeded = () => { const d=r.result;
      if(!d.objectStoreNames.contains('sesiones')) d.createObjectStore('sesiones',{keyPath:'sesion_uuid'});
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv',{keyPath:'k'}); };
    r.onsuccess = () => { DB.db = r.result; res(); };
    r.onerror = () => rej(r.error);
  }); },
  tx(store, mode, fn){ return new Promise((res,rej)=>{
    let t; try{ t = mode==='readwrite' ? DB.db.transaction(store, mode, {durability:'strict'}) : DB.db.transaction(store, mode); }
    catch(e){ t = DB.db.transaction(store, mode); }
    const req = fn(t.objectStore(store)); let out;
    if(req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => res(out);              // se resuelve solo cuando la escritura quedó confirmada
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Transacción abortada'));
  }); },
  put(store, v){ return DB.tx(store,'readwrite', s => s.put(v)); },
  get(store, k){ return DB.tx(store,'readonly', s => s.get(k)); },
  all(store){ return DB.tx(store,'readonly', s => s.getAll()); },
  del(store, k){ return DB.tx(store,'readwrite', s => s.delete(k)); }
};
async function kvGet(k, def){ const r = await DB.get('kv', k); return r ? r.v : def; }
function kvSet(k, v){ return DB.put('kv', {k, v}); }
async function saveSes(){
  try{ await DB.put('sesiones', S.ses); return true; }
  catch(e){
    alertModal('No se pudo guardar', 'La tablet no pudo guardar esta respuesta. No continúes: llama a la persona del equipo y descarga un respaldo desde el Panel.');
    return false;
  }
}
async function saveCfg(){ await kvSet('cfg', S.cfg); }

/* ---------- caritas (SVG originales) ---------- */
function faceSVG(kind, v){
  let fill='#FFD35C', eyes='', mouth='', extra='';
  const eyesO = `<circle cx="36" cy="46" r="5" fill="${INK}"/><circle cx="64" cy="46" r="5" fill="${INK}"/>`;
  const m = (c, y=68) => `<path d="M32 ${y} Q50 ${y+c} 68 ${y}" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`;
  const st = `fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"`;
  const drop = (x,y) => `<path d="M${x} ${y} Q${x-7} ${y+12} ${x} ${y+16} Q${x+7} ${y+12} ${x} ${y} Z" fill="#BFE3F7" stroke="${INK}" stroke-width="2.5"/>`;
  const shiver = `<path d="M8 42 l5 4 l-5 4 l5 4" ${st}/><path d="M92 42 l-5 4 l5 4 l-5 4" ${st}/>`;
  if(kind==='mood'){
    fill = '#FFD35C'; eyes = eyesO;
    if(v===1){ mouth = m(-14,76); extra = `<path d="M27 36 L42 31" ${st}/><path d="M73 36 L58 31" ${st}/>`; }
    if(v===2){ mouth = m(-7,72); }
    if(v===3){ mouth = m(9,65); }
    if(v===4){ mouth = `<path d="M30 61 Q50 90 70 61 Z" fill="${INK}"/>`; }
  } else if(kind==='sleep'){
    fill = '#C9C1EF';
    if(v===1){ eyes = `<circle cx="36" cy="45" r="8" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="64" cy="45" r="8" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="36" cy="45" r="4" fill="${INK}"/><circle cx="64" cy="45" r="4" fill="${INK}"/>`; mouth = m(9,66); }
    if(v===2){ eyes = eyesO; mouth = m(4,68); }
    if(v===3){ eyes = `<path d="M30 45 A6 6 0 0 0 42 45 Z" fill="${INK}"/><path d="M58 45 A6 6 0 0 0 70 45 Z" fill="${INK}"/><path d="M28 45 H44" ${st}/><path d="M56 45 H72" ${st}/>`; mouth = `<path d="M40 70 H60" ${st}/>`; }
    if(v===4){ eyes = `<path d="M29 46 Q36 52 43 46" ${st}/><path d="M57 46 Q64 52 71 46" ${st}/>`; mouth = `<ellipse cx="50" cy="71" rx="6" ry="8" fill="${INK}"/>`;
      extra = `<text x="74" y="24" font-size="20" font-weight="700" fill="${INK}" font-family="sans-serif">z</text><text x="86" y="12" font-size="14" font-weight="700" fill="${INK}" font-family="sans-serif">z</text>`; }
  } else if(kind==='thermal'){
    fill = C[v-1]; eyes = eyesO;
    if(v===1){ mouth = `<path d="M33 70 l5.7 -5 l5.7 5 l5.7 -5 l5.7 5 l5.7 -5" ${st}/>`; extra = shiver; }
    if(v===2){ mouth = m(-4,70); extra = `<path d="M8 46 l5 4 l-5 4" ${st}/><path d="M92 46 l-5 4 l5 4" ${st}/>`; }
    if(v===3){ mouth = m(10,65); }
    if(v===4){ mouth = m(-3,70); extra = drop(84,24); }
    if(v===5){ eyes = `<path d="M29 47 Q36 40 43 47" ${st}/><path d="M57 47 Q64 40 71 47" ${st}/>`; mouth = `<ellipse cx="50" cy="70" rx="8" ry="9" fill="${INK}"/>`;
      extra = drop(84,22) + drop(16,26); }
  } else if(kind==='pref'){
    eyes = eyesO;

    if(v===2){ fill = C[2]; mouth = m(11,65); }
    if(v===3){ fill = C[3]; mouth = m(5,68); extra = `<path d="M88 24 V6 M81 13 L88 6 L95 13" ${st}/>`; }
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><circle cx="50" cy="52" r="40" fill="${fill}" stroke="${INK}" stroke-width="3.5"/>${eyes}${mouth}${extra}</svg>`;

function countdown(el){
  return new Promise(res => {
    let n = 3; el.classList.add('big');
    const step = () => { if(n === 0){ el.textContent=''; el.classList.remove('big'); return res(); } el.textContent = n; n--; setTimeout(step, 900); };
    step();
  });
}
function pvtEngine(ov, P, durMs){
  return new Promise(resolve => {
    const ctr = ov.querySelector('#ctr'), msg = ov.querySelector('#smsg'), hs = ov.querySelector('#hs');
    const trials = []; let state = 'isi', onset = 0, isiStart = 0, isiDur = 0, n = 0, interrupciones = 0, done = false;
    let tIsi = null, tTo = null, tFb = null, tMsg = null, tHold = null, raf = null;
    const t0 = performance.now(), e0 = Date.now(), end = t0 + durMs;
    const clock = t => stamp(new Date(e0 + (t - t0)), true);
    const evTime = e => { const ts = e && e.timeStamp; return (ts > 0 && Math.abs(ts - performance.now()) < 2000) ? ts : performance.now(); };

    function record(tipo, rt, onsetT, tapT){
      n++;
      const ref = onsetT != null ? onsetT : tapT;
      trials.push({n, tipo,
        isi_ms: onsetT != null ? r1(onsetT - isiStart) : null,
        onset_ms: r1(ref - t0), rt_ms: rt != null ? r1(rt) : null, hora_local: clock(ref)});
    }
    function scheduleISI(from){
      state = 'isi'; isiStart = from;
      isiDur = P.isi_min + Math.random() * (P.isi_max - P.isi_min);
      const at = from + isiDur;
      clearTimeout(tIsi);
      if(at > end){ tIsi = setTimeout(() => finish(false), Math.max(0, end - performance.now())); return; }
      tIsi = setTimeout(() => { raf = requestAnimationFrame(showStim); }, Math.max(0, at - performance.now() - 6));
    }
    function showStim(ts){
      if(done) return;
      state = 'stim'; onset = ts; ctr.textContent = '0'; ctr.className = 'ctr';
      const loop = t => { if(state !== 'stim') return; ctr.textContent = String(Math.max(0, Math.floor(t - onset))); raf = requestAnimationFrame(loop); };
      raf = requestAnimationFrame(loop);
      tTo = setTimeout(() => { if(state === 'stim'){ cancelAnimationFrame(raf); record('sin_respuesta', null, onset); ctr.className = 'ctr off'; scheduleISI(performance.now()); } }, P.timeout);
    }
    function respond(t){
      if(done) return;
      if(state === 'stim'){
        const rt = t - onset; clearTimeout(tTo); cancelAnimationFrame(raf);
        const tipo = rt < P.fs ? 'falsa_partida' : 'respuesta';
        record(tipo, rt, onset);
        ctr.textContent = String(Math.round(rt)); ctr.className = 'ctr' + (tipo === 'falsa_partida' ? ' warn' : '');
        scheduleISI(t);
        clearTimeout(tFb);
        tFb = setTimeout(() => { if(state !== 'stim') ctr.className = 'ctr off'; }, Math.max(150, Math.min(P.fb, isiDur - 120)));
      } else if(state === 'isi'){
        record('falsa_partida_isi', null, null, t);
        ctr.className = 'ctr off'; msg.textContent = '¡Espera los números!';
        clearTimeout(tMsg); tMsg = setTimeout(() => { msg.textContent = ''; }, 900);
        scheduleISI(t);
      }
    }
    const onDown = e => { if(e.target === hs) return; e.preventDefault(); respond(evTime(e)); };
    const onKey = e => { if(e.repeat) return; if(e.code === 'Space' || e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); respond(evTime(e)); } };
    const onVis = () => { if(document.hidden) interrupciones++; };
    const holdStart = e => { e.stopPropagation(); hs.classList.add('holding'); tHold = setTimeout(() => finish(true), 2000); };
    const holdEnd = () => { hs.classList.remove('holding'); clearTimeout(tHold); };
    function finish(aborted){
      if(done) return; done = true;
      [tIsi, tTo, tFb, tMsg, tHold].forEach(clearTimeout); cancelAnimationFrame(raf);
      ov.removeEventListener('pointerdown', onDown); window.removeEventListener('keydown', onKey);
      document.removeEventListener('visibilitychange', onVis);
      resolve({trials, aborted, interrupciones, dur_real_s: r1((performance.now() - t0)/1000)});
    }
    ov.addEventListener('pointerdown', onDown, {passive:false});
    ov.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', onKey);
    document.addEventListener('visibilitychange', onVis);
    hs.addEventListener('pointerdown', holdStart); hs.addEventListener('pointerup', holdEnd); hs.addEventListener('pointerleave', holdEnd); hs.addEventListener('pointercancel', holdEnd);
    scheduleISI(t0);
  });
}
function pvtMetrics(trials, P){
  const stim = trials.filter(t => t.tipo === 'respuesta' || t.tipo === 'falsa_partida' || t.tipo === 'sin_respuesta');
  const valid = trials.filter(t => t.tipo === 'respuesta');
  const rts = valid.map(t => t.rt_ms).sort((a,b) => a-b);
  const mean = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
  const median = a => !a.length ? null : a.length % 2 ? a[(a.length-1)/2] : (a[a.length/2-1] + a[a.length/2]) / 2;
  const k = Math.max(1, Math.round(rts.length * 0.1));
  const lapsos = valid.filter(t => t.rt_ms >= P.lapso).length + trials.filter(t => t.tipo === 'sin_respuesta').length;
  const fs = trials.filter(t => t.tipo === 'falsa_partida' || t.tipo === 'falsa_partida_isi').length;
  return {
    n_estimulos: stim.length, n_validas: valid.length,
    rt_media: r1(mean(rts)), rt_mediana: r1(median(rts)),
    vel_media: r3(mean(rts.map(x => 1000/x))),
    rt_rapido10: rts.length ? r1(mean(rts.slice(0,k))) : null,
    vel_lento10: rts.length ? r3(mean(rts.slice(-k).map(x => 1000/x))) : null,
    lapsos, falsas_partidas: fs,
    puntaje: stim.length ? r3(1 - (lapsos + fs) / stim.length) : null
  };
}
async function runTest(practice){
  const P = S.cfg.pvt;
  const ov = document.createElement('div'); ov.className = 'stage';
  ov.innerHTML = `<div class="ctr off" id="ctr">0</div><div class="smsg" id="smsg"></div><button class="hold-stop" id="hs" aria-label="Detener: mantener presionado 2 segundos">II</button>`;
  document.body.appendChild(ov);
  let lock = null; try{ if(navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); }catch(e){}
  await countdown(ov.querySelector('#smsg'));
  const inicio = stamp(new Date());
  if(!practice){ S.ses.pvt_intentos = (S.ses.pvt_intentos||0) + 1; S.ses.pvt = {params:{...P}, inicio, completa:false, interrumpida:false, trials:[]}; await saveSes(); }
  const res = await pvtEngine(ov, P, (practice ? P.practica_s : P.dur_s) * 1000);
  try{ lock && lock.release(); }catch(e){}

/* ---------- REDCap ---------- */
function trialsCSV(trials){
  return ['n,tipo,isi_ms,onset_ms,rt_ms,hora_local'].concat(trials.map(t => [t.n, t.tipo, t.isi_ms ?? '', t.onset_ms ?? '', t.rt_ms ?? '', t.hora_local].join(','))).join('\n');
}
function toRedcapRow(s){
  const p = s.pvt || {}, m = p.metrics || {}, P = p.params || {}, r = s.resp || {}, has = !!(p.trials && p.trials.length);
  const row = {
    record_id:s.sesion_uuid, id_estudiante:s.id_estudiante, metodo_id:s.metodo_id, pais:s.pais, colegio:s.colegio, sala:s.sala,
    evaluador:s.evaluador, dispositivo:s.dispositivo, dispositivo_info:s.dispositivo_info, app_version:s.app_version,
    zona_horaria:s.zona_horaria, tz_offset_min:s.tz_offset_min, inicio:s.inicio, fin:s.fin,
    animo:r.animo, somnolencia:r.somnolencia, sens_termica:r.sens_termica, pref_termica:r.pref_termica,
    estado_sesion: s.estado === 'completa' ? 1 : 2, motivo_incompleta:s.motivo,
    pvt_completa: has ? (p.completa ? 1 : 0) : null, pvt_interrumpida: has ? (p.interrumpida ? 1 : 0) : null,
    pvt_inicio:p.inicio, pvt_duracion_s:P.dur_s, pvt_isi_min_ms:P.isi_min, pvt_isi_max_ms:P.isi_max,
    pvt_umbral_lapso_ms:P.lapso, pvt_umbral_fs_ms:P.fs,
    pvt_n_estimulos:m.n_estimulos, pvt_n_validas:m.n_validas, pvt_rt_media:m.rt_media, pvt_rt_mediana:m.rt_mediana,
    pvt_vel_media:m.vel_media, pvt_rt_rapido10:m.rt_rapido10, pvt_vel_lento10:m.vel_lento10, pvt_lapsos:m.lapsos,
    pvt_falsas_partidas:m.falsas_partidas, pvt_puntaje:m.puntaje, pvt_ensayos: has ? trialsCSV(p.trials) : null,
    practica_realizada: s.practica ? 1 : 0, sesion_complete: s.estado === 'completa' ? 2 : 0
  };
  const out = {}; REDCAP_FIELDS.forEach(f => { const v = row[f]; out[f] = v == null ? '' : String(v); }); return out;
}
const isPendingSync = s => s.estado !== 'en_curso' && !!s.id_estudiante && s.sync_estado !== 'confirmado';
async function pushOne(s){
  const row = toRedcapRow(s);
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 25000);
  let r;
  try{
    r = await fetch(S.cfg.redcap_url.trim(), {method:'POST', signal:ctrl.signal,
      headers:{'Content-Type':'application/x-www-form-urlencoded', 'Accept':'application/json'},
      body:new URLSearchParams({token:S.cfg.redcap_token.trim(), content:'record', action:'import', format:'json', type:'flat',
        overwriteBehavior:'normal', forceAutoNumber:'false', data:JSON.stringify([row]), returnContent:'ids', returnFormat:'json'})});
  }catch(e){ throw new Error('Sin conexión con REDCap: no hay internet o el servidor no acepta conexiones desde esta app (CORS).'); }
  finally{ clearTimeout(to); }
  const txt = await r.text(); let j = null; try{ j = JSON.parse(txt); }catch(e){}
  if(!r.ok) throw new Error(`REDCap respondió ${r.status}: ${(j && j.error) || txt.slice(0,200)}`);
  if(Array.isArray(j) && j.map(String).includes(row.record_id)) return true;
  if(j && typeof j === 'object' && 'count' in j && Number(j.count) >= 1) return true;
  throw new Error('REDCap no confirmó el registro: ' + txt.slice(0,200));
}
let syncing = false;
async function syncAll(onProgress){
  if(syncing) return {ok:0, fail:0, busy:true};
  syncing = true; let ok = 0, fail = 0, lastErr = '';
  try{
    const todo = (await DB.all('sesiones')).filter(isPendingSync);
    for(const s of todo){
      onProgress && onProgress(`Enviando ${ok+fail+1} de ${todo.length}`);
      try{ await pushOne(s); s.sync_estado = 'confirmado'; s.sync_error = ''; s.sync_fecha = stamp(new Date()); ok++; }
      catch(e){ s.sync_estado = 'error'; s.sync_error = String(e.message || e).slice(0,300); lastErr = s.sync_error; fail++; }
      s.sync_intentos = (s.sync_intentos || 0) + 1;
      await DB.put('sesiones', s);
      if(/^Sin conexión/.test(lastErr)) break;   // sin red: no seguir intentando
    }
  } finally { syncing = false; }
  return {ok, fail, lastErr};
}
function autoSync(){
  if(inClaude() || !S.cfg || !S.cfg.redcap_url || !S.cfg.redcap_token || !navigator.onLine) return;
  syncAll().catch(()=>{});
}

/* ---------- exportación ---------- */
function csvEsc(v){ if(v == null) return ''; const s = String(v); return /[",\n\r;]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function toCSV(rows, cols){ return [cols.join(',')].concat(rows.map(r => cols.map(c => csvEsc(r[c])).join(','))).join('\r\n'); }
async function saveFile(name, text, mime){
  if(isNative()){
    const {Filesystem, Share} = window.Capacitor.Plugins || {};
    if(Filesystem && Share){
      try{ const w = await Filesystem.writeFile({path:name, data:text, directory:'CACHE', encoding:'utf8'}); await Share.share({title:name, url:w.uri}); return; }
      catch(e){ toast('No se pudo compartir el archivo: ' + (e.message || e)); return; }
    }
  }
  if(inClaude()){
    try{
      const d = await window.claude.use('downloads');
      if(d){ await d.save({filename:name, data:text}); toast('Archivo descargado'); return; }
    }catch(e){ if(e && e.code === 'declined') return; toast('No se pudo descargar: ' + (e && (e.message || e.code))); return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:mime}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const fileBase = () => `escuelascool_${(S.cfg.dispositivo||'tablet').replace(/[^A-Za-z0-9_-]/g,'')}_${compact(new Date())}`;

/* ---------- lista del curso (CSV) ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const sep = (firstLine.match(/;/g)||[]).length > (firstLine.match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === sep){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function normDate(s){
  s = String(s || '').trim(); let m;
  if((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return null;
}
function rosterFromCSV(text){
  const rows = parseCSV(text); if(!rows.length) throw new Error('El archivo está vacío.');
  const h = rows[0].map(x => x.trim().toLowerCase());
  const ix = k => h.indexOf(k);
  const need = ['record_id','nombre','fecha_nacimiento','sala'];
  const miss = need.filter(k => ix(k) < 0);
  if(miss.length) throw new Error('Faltan columnas: ' + miss.join(', ') + '.');
  const out = [], bad = [], seen = new Set();
  rows.slice(1).forEach((r, i) => {
    const o = {record_id:(r[ix('record_id')]||'').trim(), nombre:(r[ix('nombre')]||'').trim(), fecha_nacimiento:normDate(r[ix('fecha_nacimiento')]), sala:(r[ix('sala')]||'').trim()};
    if(!o.record_id || !o.nombre || !o.fecha_nacimiento || !o.sala || seen.has(o.record_id)) bad.push(i + 2);
    else { seen.add(o.record_id); out.push(o); }
  });
  return {out, bad};
}

    if(!conf.length){ toast('No hay sesiones confirmadas para borrar.'); return; }
    const o = await formModal('Borrar sesiones confirmadas', `Se borrarán ${conf.length} sesiones que REDCap ya confirmó. Escribe BORRAR para continuar.`, [{name:'w', label:'Confirmación', required:true}], 'Borrar');
    if(!o || o.w.trim().toUpperCase() !== 'BORRAR') return;
    for(const s of conf) await DB.del('sesiones', s.sesion_uuid);
    toast(`${conf.length} sesiones borradas de la tablet`); panelScreen();
  };
}

/* ---------- arranque ---------- */
async function recoverOpen(){
  for(const s of await DB.all('sesiones')){
    if(s.estado === 'en_curso'){ s.estado = 'incompleta'; s.motivo = s.motivo || 'la app se cerró antes de terminar'; await DB.put('sesiones', s); }
  }
}
function registerSW(){
  if(inClaude() || isNative() || !('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
window.addEventListener('beforeunload', e => { if(S.ses && S.ses.estado === 'en_curso'){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('online', autoSync);
window.addEventListener('load', registerSW);
(async () => {
  try{ if(!window.indexedDB) throw new Error('sin IndexedDB'); await DB.open(); }
  catch(e){
    app.innerHTML = `<div class="fatal"><h1 class="h-eval">Este navegador no permite guardar datos</h1><p>Abre la app en Chrome (Android) o Safari (iPhone), fuera del modo incógnito.</p></div>`;
    return;
  }
  S.cfg = await kvGet('cfg', null);
  if(S.cfg) S.cfg = {...DEFAULT_CFG, ...S.cfg, pvt:{...PVT_DEFAULT, ...(S.cfg.pvt || {})}};
  S.roster = await kvGet('roster', []);
  await recoverOpen();
  if(!S.cfg) setupScreen(); else { askPersist(); homeScreen(); autoSync(); }
})();
</script>
